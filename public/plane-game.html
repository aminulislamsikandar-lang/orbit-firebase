<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Orbit Jahaz</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#eef2f6;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#222;overflow:hidden;touch-action:none}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  .iconbtn{position:fixed;top:10px;width:40px;height:40px;border:none;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .iconbtn svg{width:22px;height:22px;stroke:#333;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  #bReplay{left:calc(50% - 46px)}
  #bPause{left:calc(50% + 6px)}
  #bBack{left:10px}
  #menu{position:fixed;inset:0;background:rgba(238,242,246,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center;overflow:auto}
  #menu.hide{display:none}
  h1{margin:0;font-size:28px;font-weight:600;letter-spacing:.3px}
  #sub{margin:0;color:#666;font-size:14px;max-width:320px;line-height:1.4}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:320px}
  .mode,.diff{border:none;background:#fff;border-radius:14px;padding:13px 8px;font-size:16px;color:#333;cursor:pointer}
  .mode.on,.diff.on{background:#222;color:#fff}
  .diffs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;width:100%;max-width:320px}
  .diff{font-size:14px;padding:10px 4px}
  .go{border:none;background:#222;color:#fff;border-radius:14px;padding:14px 44px;font-size:18px;cursor:pointer}
  label{font-size:14px;color:#555;display:flex;gap:8px;align-items:center}
  #best{font-size:14px;color:#666}
  #stars{display:flex;gap:6px;height:36px}
  #stars svg{width:34px;height:34px;stroke:#333;stroke-width:1.5;stroke-linejoin:round;fill:none}
  #stars svg.f{fill:#333}
  .small{font-size:12px;color:#888;max-width:300px;line-height:1.4}
</style>
</head>
<body>
<canvas id="c"></canvas>

<button class="iconbtn" id="bBack" aria-label="Wapas">
  <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
</button>
<button class="iconbtn" id="bReplay" aria-label="Phir se suno">
  <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7"/></svg>
</button>
<button class="iconbtn" id="bPause" aria-label="Pause">
  <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
</button>

<div id="menu">
  <h1>Orbit Jahaz</h1>
  <div id="stars"></div>
  <p id="sub">Jo akshar ya number bolega, jahaz ko usi raste se nikaalo. Galat raste par jaan kam hogi.</p>
  <div class="modes" id="modes">
    <button class="mode on" data-m="alpha">A B C</button>
    <button class="mode" data-m="num">1 2 3</button>
    <button class="mode" data-m="swar">अ आ इ</button>
    <button class="mode" data-m="vyanjan">क ख ग</button>
    <button class="mode" data-m="mix" style="grid-column:span 2">Sab mix</button>
  </div>
  <div class="diffs" id="diffs">
    <button class="diff" data-d="easy">Aasaan</button>
    <button class="diff on" data-d="normal">Normal</button>
    <button class="diff" data-d="hard">Tez</button>
  </div>
  <label><input type="checkbox" id="hint"> Hint dikhao (upar akshar)</label>
  <button class="go" id="bStart">Shuru</button>
  <div id="best"></div>
  <div class="small">Jo akshar galat hota hai wo baad me zyada baar aata hai, taaki practice ho jaye.</div>
</div>

<script>
(function(){
  var SETS = {
    alpha: "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""),
    num: "0123456789".split(""),
    swar: "अ आ इ ई उ ऊ ऋ ए ऐ ओ औ".split(" "),
    vyanjan: "क ख ग घ ङ च छ ज झ ञ ट ठ ड ढ ण त थ द ध न प फ ब भ म य र ल व श ष स ह".split(" ")
  };
  SETS.mix = [].concat(SETS.alpha, SETS.num, SETS.swar, SETS.vyanjan);
  var DIFF = { easy: { base: 90, max: 210 }, normal: { base: 115, max: 270 }, hard: { base: 150, max: 340 } };
  var SKY = [["#dfe9f3","#f6f9fc"],["#f1e8dd","#fcf8f2"],["#e1efe4","#f6fbf7"],["#e4e4f2","#f7f7fc"]];
  var PRAISE = [["शाबाश","hi-IN"],["बहुत बढ़िया","hi-IN"],["वाह","hi-IN"],["Very good","en-IN"]];

  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var W = 0, H = 0, DPR = 1, GW = 0, X0 = 0, LANES = 3, LW = 0, planeY = 0;
  function setLanes(n){ LANES = n; LW = GW / n; }
  function resize(){
    DPR = window.devicePixelRatio || 1;
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    GW = Math.min(W, 480); X0 = (W - GW) / 2; LW = GW / LANES; planeY = H * 0.78;
  }
  window.addEventListener("resize", resize); resize();

  // ---------- saved settings ----------
  var CFG_KEY = "orbit_jahaz_cfg", BEST_KEY = "orbit_jahaz_best_";
  var cfg = { mode: "alpha", diff: "normal", hint: false };
  try { var s = JSON.parse(localStorage.getItem(CFG_KEY) || "{}"); for (var k in s) cfg[k] = s[k]; } catch(e){}
  if (!SETS[cfg.mode]) cfg.mode = "alpha";
  if (!DIFF[cfg.diff]) cfg.diff = "normal";
  function saveCfg(){ try { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); } catch(e){} }
  function best(){ try { return +localStorage.getItem(BEST_KEY + cfg.mode + "_" + cfg.diff) || 0; } catch(e){ return 0; } }
  function saveBest(){ try { if (score > best()) localStorage.setItem(BEST_KEY + cfg.mode + "_" + cfg.diff, score); } catch(e){} }
  function showBest(){ document.getElementById("best").textContent = "Best score: " + best(); }

  // ---------- audio ----------
  var voices = [];
  function loadVoices(){ voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
  if (window.speechSynthesis){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
  function pickVoice(lang){
    var pre = lang.slice(0, 2).toLowerCase();
    for (var i = 0; i < voices.length; i++) if (voices[i].lang.replace("_","-").toLowerCase() === lang.toLowerCase()) return voices[i];
    for (var j = 0; j < voices.length; j++) if (voices[j].lang.toLowerCase().indexOf(pre) === 0) return voices[j];
    return null;
  }
  function speakText(text, lang, rate){
    if (!window.speechSynthesis) return;
    try {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.lang = lang; u.rate = rate || 0.8; u.pitch = 1;
      var v = pickVoice(lang); if (v) u.voice = v;
      speechSynthesis.speak(u);
    } catch(e){}
  }
  function speak(ch){ if (ch) speakText(ch, /[A-Za-z0-9]/.test(ch) ? "en-IN" : "hi-IN", 0.75); }
  var actx = null;
  function beep(freq, dur, type){
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(.12, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch(e){}
  }

  // ---------- state ----------
  var running = false, paused = false;
  var score = 0, lives = 3, MAXLIVES = 5, streak = 0, speed = 110, row = null, lastT = 0, speakTimer = 0;
  var flash = 0, flashColor = "#2a9d5c", shake = 0, banner = 0, bannerText = "";
  var planeX = 0, targetX = 0, scrollY = 0, clouds = [], parts = [], mistakes = {}, sessionMistakes = 0;
  var RH = 96;

  function level(){ return Math.floor(score / 10) + 1; }

  function pickTarget(){
    var set = SETS[cfg.mode], total = 0, w = [];
    for (var i = 0; i < set.length; i++){ var wt = 1 + 3 * (mistakes[set[i]] || 0); w.push(wt); total += wt; }
    var r = Math.random() * total;
    for (var j = 0; j < set.length; j++){ r -= w[j]; if (r <= 0) return set[j]; }
    return set[set.length - 1];
  }

  function newRow(){
    setLanes(score >= 15 ? 4 : 3);
    var set = SETS[cfg.mode], target = pickTarget();
    var correct = Math.floor(Math.random() * LANES), items = [], used = {};
    used[target] = 1;
    for (var i = 0; i < LANES; i++){
      if (i === correct){ items.push(target); continue; }
      var c, tries = 0;
      do { c = set[Math.floor(Math.random() * set.length)]; tries++; } while (used[c] && tries < 40);
      used[c] = 1; items.push(c);
    }
    row = { y: -RH, items: items, correct: correct, target: target, done: false, extra: 0 };
    speakTimer = 0; speak(target);
  }

  function burst(x, y, color, n, spd){
    for (var i = 0; i < n; i++){
      var a = Math.random() * 6.283, s = (.4 + Math.random()) * spd;
      parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .6, max: .6, c: color, r: 2 + Math.random() * 3 });
    }
  }

  function reset(){
    var d = DIFF[cfg.diff];
    score = 0; lives = 3; streak = 0; speed = d.base; row = null; flash = 0; shake = 0; banner = 0; sessionMistakes = 0;
    setLanes(3); planeX = targetX = W / 2; parts = [];
    clouds = [];
    for (var i = 0; i < 9; i++) clouds.push({ x: Math.random() * W, y: Math.random() * H, s: .5 + Math.random() * .9 });
  }

  function start(){
    reset(); running = true; paused = false;
    document.getElementById("menu").classList.add("hide");
    try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.resume) actx.resume(); } catch(e){}
    lastT = performance.now(); newRow();
  }

  // Three star icons built with DOM nodes (no innerHTML): the first n are filled.
  function fillStars(n){
    var NS = "http://www.w3.org/2000/svg", box = document.getElementById("stars");
    while (box.firstChild) box.removeChild(box.firstChild);
    for (var i = 0; i < 3; i++) {
      var svg = document.createElementNS(NS, "svg"), p = document.createElementNS(NS, "path");
      svg.setAttribute("viewBox", "0 0 24 24"); if (i < n) svg.setAttribute("class", "f");
      p.setAttribute("d", "M12 3l2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 17l-5.4 2.8 1.1-6.1-4.5-4.3 6.1-.8z");
      svg.appendChild(p); box.appendChild(svg);
    }
  }

  function gameOver(){
    running = false; saveBest();
    var n = score >= 30 ? 3 : score >= 15 ? 2 : score >= 5 ? 1 : 0;
    fillStars(n);
    document.getElementById("sub").textContent = "Score: " + score + ". Level: " + level() + ". Phir se khelo?";
    document.getElementById("bStart").textContent = "Phir se";
    showBest();
    document.getElementById("menu").classList.remove("hide");
    if (window.speechSynthesis) speechSynthesis.cancel();
  }

  function pause(on){
    if (!running) return;
    paused = on;
    if (on && window.speechSynthesis) speechSynthesis.cancel();
    if (!on){ lastT = performance.now(); if (row && !row.done) speak(row.target); }
  }

  // ---------- update ----------
  function update(dt){
    var d = DIFF[cfg.diff];
    var minX = X0 + 24, maxX = X0 + GW - 24;
    targetX = Math.max(minX, Math.min(maxX, targetX));
    planeX += (targetX - planeX) * Math.min(1, dt * 12);
    scrollY = (scrollY + speed * dt) % 60;
    clouds.forEach(function(c){ c.y += speed * .45 * dt * c.s; if (c.y > H + 40){ c.y = -40; c.x = Math.random() * W; } });
    if (flash > 0) flash -= dt;
    if (shake > 0) shake -= dt;
    if (banner > 0) banner -= dt;

    // engine trail
    if (parts.length < 220) parts.push({ x: planeX + (Math.random() - .5) * 6, y: planeY + 26, vx: 0, vy: 60 + speed * .3, life: .4, max: .4, c: "#9aa5b1", r: 2.5 });
    parts.forEach(function(p){ p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; });
    parts = parts.filter(function(p){ return p.life > 0; });

    if (!row){ newRow(); return; }
    row.y += speed * dt;

    if (!row.done){
      speakTimer += dt;
      if (speakTimer > 4){ speakTimer = 0; speak(row.target); }
      if (row.y + RH / 2 >= planeY - 18){
        var n = row.items.length, cw = GW / n;
        var lane = Math.max(0, Math.min(n - 1, Math.floor((planeX - X0) / cw)));
        row.done = true;
        if (lane === row.correct){
          score++; streak++; speed = Math.min(d.max, speed + 4);
          mistakes[row.target] = Math.max(0, (mistakes[row.target] || 0) - 1);
          flash = .25; flashColor = "#2a9d5c";
          burst(X0 + (row.correct + .5) * cw, row.y, "#2a9d5c", 16, 140);
          beep(660, .15); setTimeout(function(){ beep(880, .15); }, 120);
          if (streak % 10 === 0 && lives < MAXLIVES){ lives++; bannerText = "Ek jaan badhi"; banner = 1.5; }
          if (score % 10 === 0){ bannerText = "Level " + level(); banner = 1.8; }
          if (streak % 5 === 0){
            var p = PRAISE[Math.floor(Math.random() * PRAISE.length)];
            setTimeout(function(){ speakText(p[0], p[1], .9); }, 250); row.extra = 1.0;
          }
        } else {
          lives--; streak = 0; sessionMistakes++;
          mistakes[row.target] = Math.min(4, (mistakes[row.target] || 0) + 1);
          flash = .35; flashColor = "#d64545"; shake = .3;
          burst(planeX, planeY, "#d64545", 14, 120);
          beep(180, .3, "square");
          if (lives <= 0){ setTimeout(gameOver, 500); }
          else { row.extra = .9; setTimeout(function(){ if (running && row && row.done) speak(row.target); }, 450); }
        }
      }
    }
    if (row.done && row.y - RH / 2 > planeY + 40 && lives > 0){
      if (row.extra > 0) row.extra -= dt; else newRow();
    }
  }

  // ---------- draw ----------
  function rr(x, y, w, h, r){
    ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawPlane(x, y, tilt){
    ctx.save(); ctx.translate(x, y); ctx.rotate(tilt);
    ctx.strokeStyle = "#222"; ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.lineCap = "round"; ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.moveTo(0, -30); ctx.quadraticCurveTo(8, -14, 7, 14); ctx.lineTo(0, 22); ctx.lineTo(-7, 14); ctx.quadraticCurveTo(-8, -14, 0, -30); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(7, -4); ctx.lineTo(30, 14); ctx.lineTo(28, 20); ctx.lineTo(7, 12); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-7, -4); ctx.lineTo(-30, 14); ctx.lineTo(-28, 20); ctx.lineTo(-7, 12); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, 16); ctx.lineTo(14, 26); ctx.lineTo(0, 22); ctx.lineTo(-14, 26); ctx.lineTo(-4, 16); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -12, 3, 0, 6.3); ctx.stroke();
    ctx.restore();
  }

  function draw(){
    var pal = SKY[(level() - 1) % SKY.length];
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * 12 * (shake / .3), (Math.random() - .5) * 12 * (shake / .3));

    ctx.strokeStyle = "#b9c4cf"; ctx.lineWidth = 1.2;
    clouds.forEach(function(c){
      var s = c.s * 18; ctx.beginPath();
      ctx.arc(c.x, c.y, s, Math.PI, 0); ctx.arc(c.x + s * 1.3, c.y + 2, s * .8, Math.PI, 0);
      ctx.moveTo(c.x - s, c.y); ctx.lineTo(c.x + s * 2.1, c.y + 2); ctx.stroke();
    });

    ctx.strokeStyle = "#c3ccd6"; ctx.setLineDash([10, 14]); ctx.lineDashOffset = -scrollY;
    for (var i = 1; i < LANES; i++){ ctx.beginPath(); ctx.moveTo(X0 + i * LW, 0); ctx.lineTo(X0 + i * LW, H); ctx.stroke(); }
    ctx.setLineDash([]);

    if (row){
      var n = row.items.length, rw = GW / n;
      for (var k = 0; k < n; k++){
        var cx = X0 + k * rw + 8, cw = rw - 16, cy = row.y - RH / 2 + 8, ch = RH - 16;
        var isOk = row.done && k === row.correct;
        rr(cx, cy, cw, ch, 16);
        ctx.fillStyle = row.done && !isOk ? "rgba(255,255,255,.55)" : "#fff"; ctx.fill();
        ctx.lineWidth = isOk ? 2.5 : 1.2; ctx.strokeStyle = isOk ? "#2a9d5c" : "#9aa5b1"; ctx.stroke();
        ctx.fillStyle = row.done && !isOk ? "#aab3bd" : "#222";
        ctx.font = "600 38px system-ui, 'Noto Sans Devanagari', sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(row.items[k], cx + cw / 2, cy + ch / 2 + 2);
      }
    }

    parts.forEach(function(p){
      ctx.globalAlpha = Math.max(0, p.life / p.max) * .8;
      ctx.strokeStyle = p.c; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3); ctx.stroke();
    });
    ctx.globalAlpha = 1;

    var tilt = Math.max(-.3, Math.min(.3, (targetX - planeX) * .012));
    drawPlane(planeX, planeY, tilt);
    ctx.restore();

    if (flash > 0){ ctx.fillStyle = flashColor; ctx.globalAlpha = Math.min(.22, flash); ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }

    // HUD
    ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillStyle = "#222"; ctx.font = "600 20px system-ui, sans-serif";
    ctx.fillText(String(score), 62, 30);
    ctx.font = "500 12px system-ui, sans-serif"; ctx.fillStyle = "#777";
    ctx.fillText("Lv " + level(), 62, 50);
    if (streak >= 3){ ctx.fillStyle = "#555"; ctx.font = "600 13px system-ui, sans-serif"; ctx.fillText("x" + streak, 62, 68); }
    for (var l = 0; l < MAXLIVES; l++){
      ctx.beginPath(); ctx.arc(W - 16 - l * 18, 30, 6, 0, 6.3);
      ctx.lineWidth = 1.4; ctx.strokeStyle = l < lives ? "#333" : "#c3ccd6";
      if (l < lives){ ctx.fillStyle = "#333"; ctx.fill(); } ctx.stroke();
    }
    if (cfg.hint && row && !row.done){
      ctx.textAlign = "center"; ctx.font = "600 30px system-ui, 'Noto Sans Devanagari', sans-serif"; ctx.fillStyle = "#666";
      ctx.fillText(row.target, W / 2, 84);
    }
    if (banner > 0){
      ctx.globalAlpha = Math.min(1, banner);
      ctx.textAlign = "center"; ctx.fillStyle = "#222"; ctx.font = "600 26px system-ui, sans-serif";
      ctx.fillText(bannerText, W / 2, H * 0.32);
      ctx.globalAlpha = 1;
    }
    if (paused){
      ctx.fillStyle = "rgba(238,242,246,.85)"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "#222"; ctx.textAlign = "center"; ctx.font = "600 24px system-ui, sans-serif"; ctx.fillText("Pause", W / 2, H / 2 - 10);
      ctx.fillStyle = "#777"; ctx.font = "14px system-ui, sans-serif"; ctx.fillText("Screen par tap karke aage badho", W / 2, H / 2 + 20);
    }
  }

  function loop(t){
    var dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
    if (running && !paused) update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  window.addEventListener("pointerdown", function(e){
    if (e.target !== cv || !running) return;
    if (paused){ pause(false); return; }
    targetX = e.clientX;
  });
  window.addEventListener("pointermove", function(e){
    if (e.target !== cv || !running || paused) return;
    if (e.buttons || e.pointerType === "touch") targetX = e.clientX;
  });
  window.addEventListener("keydown", function(e){
    if (!running) return;
    if (e.key === " "){ pause(!paused); return; }
    if (paused){ pause(false); return; }
    if (e.key === "ArrowLeft" || e.key === "a") targetX -= LW;
    else if (e.key === "ArrowRight" || e.key === "d") targetX += LW;
    else if (e.key === "r" && row) speak(row.target);
  });
  document.addEventListener("visibilitychange", function(){ if (document.hidden) pause(true); });

  document.getElementById("bReplay").onclick = function(e){ e.stopPropagation(); if (row) speak(row.target); };
  document.getElementById("bPause").onclick = function(e){ e.stopPropagation(); pause(!paused); };
  document.getElementById("bBack").onclick = function(e){ e.stopPropagation(); if (history.length > 1) history.back(); else location.href = "/"; };
  document.getElementById("bStart").onclick = start;

  function syncMenu(){
    [].forEach.call(document.querySelectorAll(".mode"), function(b){ b.classList.toggle("on", b.getAttribute("data-m") === cfg.mode); });
    [].forEach.call(document.querySelectorAll(".diff"), function(b){ b.classList.toggle("on", b.getAttribute("data-d") === cfg.diff); });
    document.getElementById("hint").checked = !!cfg.hint;
    showBest();
  }
  document.getElementById("modes").onclick = function(e){
    var m = e.target.getAttribute && e.target.getAttribute("data-m"); if (!m) return;
    cfg.mode = m; mistakes = {}; saveCfg(); syncMenu();
  };
  document.getElementById("diffs").onclick = function(e){
    var d = e.target.getAttribute && e.target.getAttribute("data-d"); if (!d) return;
    cfg.diff = d; saveCfg(); syncMenu();
  };
  document.getElementById("hint").onchange = function(){ cfg.hint = this.checked; saveCfg(); };

  reset(); syncMenu(); requestAnimationFrame(function(t){ lastT = t; loop(t); });
})();
