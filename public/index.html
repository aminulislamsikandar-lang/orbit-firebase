<div id="app"><h1 style="font-size:26px;margin-top:14px">Orbit Tutorial</h1><p class="mut">Free AI study helper for school students in Assam: textbook-style answers, diagrams and translations for Class 7, Class 8 and Class 10 (English, Mathematics, Science). Log in with Google to start.</p><p class="mut">Loading…</p></div>

<script>
const $=s=>document.querySelector(s);

 ai:ic('<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/>'),
 heart:ic(HEART),

 topper:ic('<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/>'),

  more:ic('<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'),

 back:ic('<path d="M15 6l-6 6 6 6"/>'),

};
// translation languages: key -> button label, speech voice
// Translation styles (3-dot menu). 'para' is the original paragraph translation. The student can make any style the default.
// A course with sourceLang 'Hindi' (Class 6 Hindi) has Hindi text; its translations go to English / Assamese / Bengali.
const isHi=c=>!!(c&&c.sourceLang==='Hindi');
const isAs=c=>!!(c&&c.sourceLang==='Assamese');   // Class 2 Assamese: poem and answers are Assamese; translations go to English / Hinglish / Bengali
const courseOfId=id=>{const e=IDX[rid(id)];return e&&e.course};
const trKeys=c=>isHi(c)?['en','as','bn']:isAs(c)?['en','hing','bn']:['hing','as','bn'];
const origName=c=>isHi(c)?'Hindi':isAs(c)?'অসমীয়া':'English';
const TSTY=[['para','Paragraph'],['sent','Sentence by sentence'],['words','Kuch words ka meaning'],['brackets','Meaning in brackets']];
const TRL={en:{n:'English',v:'en-IN'},hing:{n:'Hinglish',v:'hi-IN'},as:{n:'অসমীয়া',v:'as-IN'},bn:{n:'বাংলা',v:'bn-IN'}};

let DATA=null,VIEW='home';
const PARENT_LINK=/[?&]parent-setup=1/.test(location.search);   // link a parent gets on WhatsApp: opens the Advanced AI Features page (guide only until logged in)
if(PARENT_LINK)VIEW='ai';
// DATA = {courses:[{id,class,subject,chapters:[{no,title,kind,author,locked,sections}]}]}.
// Older cached data (one course without "courses") is converted by norm().
const norm=d=>{
 if(!d)return null;
 if(d.courses)return d;
 if(d.chapters)return{courses:[{id:'c10-science',class:d.class||10,subject:d.subject||'Science',chapters:d.chapters}]};
 if(d.sections&&d.chapter)return{courses:[{id:'c10-science',class:d.class||10,subject:d.subject||'Science',chapters:[{no:d.chapter.no,title:d.chapter.title,sections:d.sections}]}]};
 return null;
};
let IDX={};   // question id -> {course,ch,q}
const courseOf=(cls,sub,med)=>DATA.courses.find(c=>c.class===cls&&c.subject===sub&&(!med||(c.medium||'English')===med));
const isLocked=ch=>!!ch.locked||!(ch.sections&&ch.sections.length);
const cLabel=c=>`Class ${c.class} ${c.subject}`;
const chOf=id=>(IDX[id]||{}).ch||{title:''};

// Where the student is: classes -> subjects -> index (chapters) -> chapter. Remembered on this device.
const NKEY='orbit_nav_v1',CHKEY='orbit_chapter_v1';
// Home flow: Board or School -> Class + Medium -> Subjects -> Chapters -> Questions.
// To add content later: put the course id into CATALOG.content[org][class]. Only English medium has content for now.
const CATALOG={
 groups:[
  {t:'Boards',items:[{id:'seba',name:'SEBA',sub:'Assam board'},{id:'cbse',name:'CBSE',sub:'Central board'}]},
  {t:'Schools',items:[{id:'nashib',name:'Nashib Ali Academy'},{id:'popular',name:'Popular Academy'},{id:'halimon',name:'Halimon Nessa Academy'}]}
 ],
 classes:{seba:[9,10],cbse:[9,10],nashib:[2,6,7,8,9,10],popular:[6,7,8,9,10],halimon:[6,7,8,9,10]},
 content:{
  seba:{10:[['c10-science','General Science']]},
  nashib:{2:[['c2-assamese','Assamese']],6:[['c6-english','English'],['c6-grammar','English Grammar'],['c6-social','Social Science'],['c6-science','General Science'],['c6-hindi','Hindi'],['c6-assamese','Assamese'],['c6-arabic','Arabic'],['c6-maths']],7:[['c7-english'],['c7-maths'],['c7-science']]},
  popular:{7:[['c7-english'],['c7-maths'],['c7-science']]},
  halimon:{7:[['c7-english'],['c7-maths'],['c7-science']],8:[['c8-english']]}
 }
};
const MEDIUMS=['Assamese','English'];
const orgOf=id=>CATALOG.groups.flatMap(g=>g.items).find(o=>o.id===id);
function pickList(org,cls,med){return((CATALOG.content[org]||{})[cls]||[]).map(([id,name])=>{const c=DATA&&DATA.courses.find(x=>x.id===id);return c&&(!med||(c.medium||'English')===med)?{c,name:name||c.subject}:null}).filter(Boolean)}
const cTitle=c=>{for(const o in CATALOG.content)for(const k in CATALOG.content[o])for(const [id,n] of CATALOG.content[o][k])if(id===c.id&&n)return n;return c.subject};
let NAV={page:'home'},LOCKED=null;

 try{
  if(!s.code){
   if(!window.CLOUD||!window.CLOUD.videos||!window.CLOUD.videos.getCode)throw new Error('Cloud load nahi hua. Page refresh karo.');
   s.code=await window.CLOUD.videos.getCode(rec.id);

const gvNorm=t=>window.MathVideo&&window.MathVideo.normQuestion?window.MathVideo.normQuestion(t):String(t||'').toLowerCase().replace(/[−–—]/g,'-').replace(/[×✕·]/g,'*').replace(/÷/g,'/').replace(/\s+/g,'');   // same normaliser as the server (superscripts / ** become ^N), so the library key matches
async function gvKey(t,eng,pre){            // same question (spaces/case ignored) + same English-words level -> same 40-character id (level 2 keeps the old id); science ids start with 's|'
 const n=(pre||'')+gvNorm(t)+(eng===2||eng==null?'':'|e'+eng);
 try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(n));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,40)}
 catch(e){let h=5381;for(const ch of n)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return h.toString(16).padStart(8,'0').repeat(5).slice(0,40)}
}
// Get Video takes only questions that exist in the app, for the chosen subject (the server checks the same).
function gvKnown(text,sub){
 const M=window.MathVideo;if(!M||!M.linesMatch)return true;   // checker missing: the server still decides
 for(const id in IDX){const x=IDX[id];if(x.course.subject!==sub)continue;if(M.linesMatch(text,[x.q.text].concat(x.q.parts||[],x.q.options||[]).filter(Boolean)))return true}
 return false;
}

 else if(act==='gvgo')gvRun();
 else if(act==='gvsub')gvSwitch(b.dataset.v);
 else if(act==='gvplay'){if(GV.plan&&window.MathVideoPlayer)window.MathVideoPlayer.open(GV.plan)}
 else if(act==='pin'){ui(id).qm=false;pin(id)}
 else if(act==='qm'){const u=ui(id),was=u.qm;for(const k in UI)UI[k].qm=false;u.qm=!was;draw()}
 else if(act==='qtr'){const u=ui(id);if(u.qt){u.qt=null;u.qm=false;draw()}else qTr(id,dLang(id))}
 else if(act==='qcp')qCopy(id);
 else if(act==='qtrset')qTr(id,b.dataset.to);
 else if(act==='setl'){ST.tlang=b.dataset.v;LS.cid='';stSave();draw()}
 else if(act==='more'){const u=ui(id);u.more=!u.more;draw()}
 else if(act==='mk')setMore(id,b.dataset.k);
 else if(act==='xre')reMore(id,b.dataset.k);
 else if(act==='stoggle'){const u=ui(id);u.sty=!u.sty;draw()}
 else if(act==='tsty')setSty(id,b.dataset.s);
 else if(act==='tdef')setDef(id,b.dataset.s);
 else if(act==='org')navTo({page:'pick',org:b.dataset.org});
 else if(act==='pcls'||act==='pmed'){if(act==='pcls')NAV.cls=+b.dataset.v;else NAV.med=b.dataset.v;navSave();try{history.replaceState({nav:NAV},'')}catch(e){}draw()}
 else if(act==='pg')navTo({page:b.dataset.p,org:NAV.org,med:NAV.med,cls:b.dataset.cls?+b.dataset.cls:NAV.cls,sub:b.dataset.sub||NAV.sub,ch:b.dataset.ch?+b.dataset.ch:null});
 else if(act==='back')goBack();
 else if(act==='lock'){LOCKED=+b.dataset.ch;draw()}
 else if(act==='setd'){ST.dtype=b.dataset.v;stSave();draw()}
 else if(act==='sett'){ST.theme=b.dataset.v;applyTheme();stSave();draw()}
 else if(act==='seti'){ST.img=b.dataset.v==='off'?'off':'on';stSave();draw();if(ST.img==='on')for(const k in OPEN)if(OPEN[k]&&ANS[k]&&ANS[k].text)ensureImg(k)}
 else if(act==='ask')ask(id,false);
 else if(act==='re')ask(id,true);
 else if(act==='like')like(id);
 else if(act==='tr'){const u=ui(id);u.menu=!u.menu;if(u.menu&&!u.tr)setTr(id,dLang(id));else draw()}
 else if(act==='trset')setTr(id,b.dataset.to);
 else if(act==='vis')toggleVis(id);
 else if(act==='visre')genVis(id,true);
 else if(act==='say')say(id);
 else if(act==='cp')copy(id);
 else if(act==='vid')openVideo(id);
 else if(act==='qvopen'){const v=VIDEOS.find(x=>x.id===id);if(v&&v.qid)ui(v.qid).qm=false;openVideo(id)}
 else if(act==='qvadd'){ui(id).qm=false;draw();if(window.QVideo)window.QVideo.open(id)}
 else if(act==='qvdel'){if(window.QVideo)window.QVideo.remove(id)}
 else if(act==='login'){LOGINERR='';window.CLOUD.login().catch(e=>{const c=e&&e.code;LOGINERR=c==='auth/popup-closed-by-user'?'':c==='auth/operation-not-allowed'?'Firebase Console me Authentication → Google enable karna baaki hai.':c==='auth/unauthorized-domain'?'Ye website Firebase ke Authorized domains me nahi hai.':'Login nahi ho paya. Dobara try karo.';draw()})}
 else if(act==='logout'){window.CLOUD.logout()}
 else if(act==='instgo')instGo();
 else if(act==='instlater'){instSnooze();instDraw()}
});

// ---- install banner (PWA): real install popup on Chrome/Edge, a short hint on iPhone Safari ----
const IBKEY='orbit_install_v1';
let DEFER=null;
const isStandalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
function instSnoozed(){try{return Date.now()-(+localStorage.getItem(IBKEY)||0)<7*864e5}catch(e){return false}}
function instSnooze(){try{localStorage.setItem(IBKEY,String(Date.now()))}catch(e){}}
function instDraw(){
 const el=$('#inst');if(!el)return;
 if(isStandalone()||instSnoozed()){el.hidden=true;return}
 if(DEFER)el.innerHTML='<div class="inst-in"><div class="inst-t"><b>Orbit</b> ko phone ya computer me install karo</div><div class="inst-b"><button class="btn" data-act="instgo">Install</button><button class="lnk" data-act="instlater">Baad me</button></div></div>';
 else if(isIOS())el.innerHTML='<div class="inst-in"><div class="inst-t"><b>Orbit</b> ko install karo: Share dabao, phir <b>Add to Home Screen</b>.</div><div class="inst-b"><button class="lnk" data-act="instlater">Theek hai</button></div></div>';
 else{el.hidden=true;return}
 el.hidden=false;
}
async function instGo(){
 if(!DEFER)return;
 const d=DEFER;DEFER=null;
 try{d.prompt();const c=await d.userChoice;if(c&&c.outcome==='dismissed')instSnooze()}catch(e){}
 instDraw();
}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFER=e;instDraw()});
window.addEventListener('appinstalled',()=>{DEFER=null;instDraw()});
instDraw();

$('#scrim').addEventListener('click',()=>openSide(false));
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#side').classList.contains('open')){openSide(false);return}
 if(e.key!=='Enter'&&e.key!==' ')return;
 const b=e.target.closest&&e.target.closest('.qb[role=button]');if(!b)return;
 e.preventDefault();toggleOpen(b.closest('.q').dataset.qid,true);
});

// Questions are cached too: the page opens at once (even offline or while Render wakes up), then refreshes quietly.
const QKEY='orbit_questions_v1';
let qOld=null;
try{qOld=localStorage.getItem(QKEY);const c=norm(JSON.parse(qOld||'null'));if(c){setData(c);draw()}}catch(e){qOld=null}
fetch('/questions.json').then(r=>r.ok?r:fetch((window.ORBIT_API||'')+'/api/questions')).then(r=>{if(!r.ok)throw new Error('q');return r.json()}).then(d=>{
 const nw=JSON.stringify(d);
 try{localStorage.setItem(QKEY,nw)}catch(e){}
 if(!DATA||nw!==qOld){const nd=norm(d);if(nd){setData(nd);draw()}}
}).catch(()=>{if(!DATA)$('#app').innerHTML='<p class="err">Questions load nahi hue. Internet check karke page refresh karo.</p>'});

if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{})});
