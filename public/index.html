<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>Orbit Tutorial – AI Science Tutor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Hind:wght@400;500;600&display=swap">
<style>
:root{--bg:#f4f2ec;--card:#fff;--tx:#111;--mut:#6b6b6b;--ln:#cfcac0;--ans:#f1f1ee;--on:#111;--onbg:#f4f2ec;--hov:rgba(0,0,0,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#111;--card:#1c1c1c;--tx:#f2f2f2;--mut:#9a9a9a;--ln:#3a3a3a;--ans:#262626;--on:#f2f2f2;--onbg:#111;--hov:rgba(255,255,255,.1)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--card:#1c1c1c;--tx:#f2f2f2;--mut:#9a9a9a;--ln:#3a3a3a;--ans:#262626;--on:#f2f2f2;--onbg:#111;--hov:rgba(255,255,255,.1)}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 Hind,system-ui,sans-serif}
h1,h2,h3{font-family:'Baloo 2',system-ui,sans-serif;margin:0;line-height:1.2}
#app{max-width:640px;margin:0 auto;padding:16px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.logo{font-family:'Baloo 2',system-ui,sans-serif;font-size:28px;display:flex;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:14px}
.chips{display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);background:var(--card);border-radius:99px;padding:5px 14px;display:inline-flex;align-items:center;gap:6px}
.chip svg{width:16px;height:16px}
.chip[aria-pressed=true]{background:var(--on);color:var(--onbg);border-color:var(--on)}
h2.sec{margin:26px 0 8px;font-size:20px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 1px 0 var(--ln)}
.qn{font-weight:700;margin-bottom:4px}
.q p{margin:4px 0}
.q .pt{margin:3px 0 3px 12px}
.tw{overflow-x:auto;margin:8px 0}
.qt{border-collapse:collapse;font-size:14px;min-width:100%}
.qt th,.qt td{border:1px solid var(--ln);padding:5px 8px;text-align:left;vertical-align:top}
.qt th{background:var(--ans);font-weight:600}
.btn{background:var(--on);color:var(--onbg);border:0;border-radius:12px;padding:10px 16px;font-weight:600;margin-top:12px}
.btn:disabled{opacity:.5;cursor:wait}
.ans{background:var(--ans);border-radius:14px;padding:12px 14px;margin-top:12px;overflow-wrap:anywhere}
.saved-note{font-size:13px;color:var(--mut);margin-top:6px}
.q.can{cursor:pointer}
.qb{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;border-radius:12px}
.qbody{min-width:0;flex:1}
.chev{flex:none;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--mut);transition:transform .15s}
.chev svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.chev.open{transform:rotate(180deg)}
@media(prefers-reduced-motion:reduce){.chev{transition:none}}

/* ChatGPT / Claude style: borderless grey line icons */
.tb{display:flex;gap:2px;margin-top:6px;flex-wrap:wrap}
.ic{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:10px;color:var(--mut);text-decoration:none;padding:0;transition:background .12s,color .12s}
.ic:hover{background:var(--hov);color:var(--tx)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic[aria-pressed=true]{background:var(--hov);color:var(--tx)}
.ic.liked svg{fill:currentColor}
.ic:disabled{opacity:.4;cursor:not-allowed}
.ic:disabled:hover{background:transparent;color:var(--mut)}
.spin svg{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin svg{animation:none}}
.vis{margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid var(--ln)}
.vis img{display:block;width:100%;height:auto;background:#fff}
.err{color:#b3261e;margin-top:10px;font-size:14px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .err{color:#ff8a80}}
:root[data-theme="dark"] .err{color:#ff8a80}
.top{display:flex;align-items:center;gap:4px;margin-left:-8px}
.q{position:relative}
.q .qbody{padding-right:34px}
.ic.pin{position:absolute;top:8px;right:46px;width:32px;height:32px}
.ic.pin.nochev{right:12px}
.ic.pin svg{width:18px;height:18px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.open{opacity:1;pointer-events:auto}
.side{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--card);z-index:30;transform:translateX(-100%);transition:transform .2s;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 10px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:1px 0 0 var(--ln);overflow-y:auto}
.side.open{transform:none}
.shead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sitem{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:transparent;border-radius:10px;text-align:left;color:var(--tx)}
.sitem svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;color:var(--mut)}
.sitem:hover{background:var(--hov)}
.sitem[aria-current=page]{background:var(--hov);font-weight:600}
.sbadge{margin-left:auto;color:var(--mut);font-size:13px}
.sgap{flex:1;min-height:12px}
.sline{border-top:1px solid var(--ln);margin:6px 4px}
.soon{margin-top:40px;text-align:center;color:var(--mut)}
.soon svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.soon p{margin:10px 0 0;font-size:18px}
@media(prefers-reduced-motion:reduce){.side,.scrim{transition:none}}
.vid{margin-top:16px}.vid video{width:100%;border-radius:12px;background:#000;margin-top:8px}
.rows{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;color:var(--tx)}
.rbadge{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ln);display:flex;align-items:center;justify-content:center;font-weight:700}
.rmain{flex:1;min-width:0}
.rtitle{font-weight:600;overflow-wrap:anywhere}
.rsub{font-size:13px;color:var(--mut);margin-top:2px}
.rgo{flex:none;color:var(--mut);display:flex}
.rgo svg,.back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.back{display:inline-flex;align-items:center;gap:2px;border:0;background:transparent;color:var(--mut);padding:6px 6px 6px 0;margin-top:6px}
.rnote{font-size:13px;color:var(--mut);margin:-4px 6px 0}
</style>
</head>
<body>
<div id="scrim" class="scrim"></div>
<aside id="side" class="side" aria-label="Menu" aria-hidden="true" inert></aside>
<div id="app"><p class="mut">Loading…</p></div>
<script src="/config.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOGO='<svg viewBox="0 0 48 48" style="width:1.1em;height:1.1em;flex:none" role="img" aria-label="Orbit logo"><ellipse cx="24" cy="24" rx="20" ry="9" fill="none" stroke="currentColor" stroke-width="2.5" transform="rotate(-25 24 24)"/><circle cx="24" cy="24" r="8" fill="currentColor"/><circle cx="42.1" cy="15.5" r="3.5" fill="currentColor"/></svg>';
const ic=p=>`<svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>`;
const HEART='<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/>';
const I={
 heart:ic(HEART),
 re:ic('<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>'),
 tr:ic('<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.5 3.5 5.5 3.5 9s-1 6.5-3.5 9c-2.5-2.5-3.5-5.5-3.5-9s1-6.5 3.5-9z"/>'),
 vis:ic('<path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/>'),
 vid:ic('<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/>'),
 say:ic('<path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'),
 stop:ic('<rect x="6" y="6" width="12" height="12" rx="2"/>'),
 cp:ic('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a1 1 0 0 1 1-1h9"/>'),
 ok:ic('<path d="M5 13l4 4L19 7"/>'),
 chev:ic('<path d="M6 9l6 6 6-6"/>'),
 menu:ic('<path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h10"/>'),
 close:ic('<path d="M6 6l12 12"/><path d="M18 6L6 18"/>'),
 home:ic('<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>'),
 pin:ic('<line x1="12" y1="17" x2="12" y2="22"/><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a2 2 0 0 0 0-4H8a2 2 0 0 0 0 4h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24z"/>'),
 pyq:ic('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h6"/>'),
 pass:ic('<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>'),
 topper:ic('<path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/>'),
 fac:ic('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6"/><path d="M18 14a6.5 6.5 0 0 1 3.5 6"/>'),
 dev:ic('<path d="M8 8l-5 4 5 4"/><path d="M16 8l5 4-5 4"/><path d="M14 5l-4 14"/>'),
 set:ic('<path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="8" cy="17" r="2"/>'),
  more:ic('<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'),
  next:ic('<path d="M9 6l6 6-6 6"/>'),
 back:ic('<path d="M15 6l-6 6 6 6"/>'),
 lock:ic('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
 login:ic('<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 8l4 4-4 4"/><path d="M14 12H3"/>')
};
// translation languages: key -> button label, speech voice
const TRL={hing:{n:'Hinglish',v:'hi-IN'},as:{n:'অসমীয়া',v:'as-IN'},bn:{n:'বাংলা',v:'bn-IN'}};

let DATA=null,VIEW='home';
// DATA = {courses:[{id,class,subject,chapters:[{no,title,kind,author,locked,sections}]}]}.
// Older cached data (one course without "courses") is converted by norm().
const norm=d=>{
 if(!d)return null;
 if(d.courses)return d;
 if(d.chapters)return{courses:[{id:'c10-science',class:d.class||10,subject:d.subject||'Science',chapters:d.chapters}]};
 if(d.sections&&d.chapter)return{courses:[{id:'c10-science',class:d.class||10,subject:d.subject||'Science',chapters:[{no:d.chapter.no,title:d.chapter.title,sections:d.sections}]}]};
 return null;
};
let IDX={};   // question id -> {course,ch,q}
const courseOf=(cls,sub)=>DATA.courses.find(c=>c.class===cls&&c.subject===sub);
const isLocked=ch=>!!ch.locked||!(ch.sections&&ch.sections.length);
const cLabel=c=>`Class ${c.class} ${c.subject}`;
const chOf=id=>(IDX[id]||{}).ch||{title:''};

// Where the student is: classes -> subjects -> index (chapters) -> chapter. Remembered on this device.
const NKEY='orbit_nav_v1',CHKEY='orbit_chapter_v1';
let NAV={page:'classes'},LOCKED=null;
try{
 const n=JSON.parse(localStorage.getItem(NKEY)||'null');
 if(n&&n.page)NAV=n;
 else if(localStorage.getItem(CHKEY))NAV={page:'chapter',cls:10,sub:'Science',ch:+localStorage.getItem(CHKEY)||1};
}catch(e){}
function navSave(){try{localStorage.setItem(NKEY,JSON.stringify(NAV))}catch(e){}}
function setData(d){
 DATA=d;IDX={};
 d.courses.forEach(c=>c.chapters.forEach(ch=>(ch.sections||[]).forEach(s=>s.questions.forEach(q=>{IDX[q.id]={course:c,ch,q}}))));
 fixNav();
}
function fixNav(){
 if(NAV.page==='classes')return;
 if(NAV.page==='subjects'){if(!DATA.courses.some(c=>c.class===NAV.cls))NAV={page:'classes'};return}
 const c=courseOf(NAV.cls,NAV.sub);
 if(!c){NAV={page:'classes'};return}
 if(NAV.page==='chapter'){const ch=c.chapters.find(x=>x.no===NAV.ch);if(!ch||isLocked(ch))NAV={page:'index',cls:NAV.cls,sub:NAV.sub}}
}
const ANS={};   // id -> {loading,text,err}
const TR={};    // id|lang -> {loading,text,err}
const VIS={};   // id -> {loading,svg,err}
const UI={};    // id -> {menu,tr,vis,say,copied,msg}
const ui=id=>UI[id]||(UI[id]={});

// Saved (liked) answers live in this browser, so the student can see later which answers they picked.
const SKEY='orbit_saved_v1';
let SAVED={};
try{SAVED=JSON.parse(localStorage.getItem(SKEY)||'{}')||{}}catch(e){SAVED={}}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(SAVED))}catch(e){}syncSoon()}
for(const id in SAVED)ANS[id]={text:SAVED[id].text};
// Every answer the AI generates is kept on this device, so it opens later even without internet.
const CKEY='orbit_answers_v1';
let CACHE={};
try{CACHE=JSON.parse(localStorage.getItem(CKEY)||'{}')||{}}catch(e){CACHE={}}
function cachePersist(){try{localStorage.setItem(CKEY,JSON.stringify(CACHE))}catch(e){}}
for(const id in SAVED)if(!CACHE[id])CACHE[id]={text:SAVED[id].text,at:SAVED[id].at};
for(const id in CACHE)if(CACHE[id]&&CACHE[id].text)ANS[id]={text:CACHE[id].text};
// Translations are kept per answer: a translation is valid only for the answer version (CACHE[id].at) it was made from.
const TKEY='orbit_tr_v1';
let TRC={};
try{TRC=JSON.parse(localStorage.getItem(TKEY)||'{}')||{}}catch(e){TRC={}}
function trPersist(){try{localStorage.setItem(TKEY,JSON.stringify(TRC))}catch(e){}}
for(const id in TRC){
 const base=(CACHE[id]||{}).at;
 for(const l in TRC[id]){const t=TRC[id][l];if(t&&t.text&&t.base===base&&TRL[l])TR[id+'|'+l]={text:t.text};else delete TRC[id][l]}
 if(!Object.keys(TRC[id]).length)delete TRC[id];
}
// A diagram is kept only for answers the student hearted (it lives inside the saved entry).
for(const id in SAVED)if(SAVED[id]&&SAVED[id].svg)VIS[id]={svg:SAVED[id].svg};
// Extra explanations (3-dot menu) are kept per answer too, and dropped when the answer is regenerated.
const MKEY='orbit_more_v1';
let MRC={};
try{MRC=JSON.parse(localStorage.getItem(MKEY)||'{}')||{}}catch(e){MRC={}}
function mrPersist(){try{localStorage.setItem(MKEY,JSON.stringify(MRC))}catch(e){}}
const MR={};   // id|kind -> {loading,text,err}
for(const id in MRC){
 const base=(CACHE[id]||{}).at;
 for(const k in MRC[id]){const t=MRC[id][k];if(t&&t.text&&t.base===base)MR[id+'|'+k]={text:t.text};else delete MRC[id][k]}
 if(!Object.keys(MRC[id]).length)delete MRC[id];
}
const MORE=[['mnemonic','Mnemonic'],['analogy','Analogy'],['kid','Explain like a kid'],['full','Full marks answer'],['points','Key points'],['mistakes','Common mistakes'],['mcq','Practice MCQ']];
const OPEN={};   // id -> answer is visible (hidden by default)

// Pinned questions and settings also live on this device.
const PKEY='orbit_pins_v1',STKEY='orbit_settings_v1';
let PINS={},ST={theme:'auto',dtype:'auto'};
try{PINS=JSON.parse(localStorage.getItem(PKEY)||'{}')||{}}catch(e){PINS={}}
try{ST={...ST,...(JSON.parse(localStorage.getItem(STKEY)||'{}')||{})}}catch(e){}
const isPinned=id=>!!PINS[id];
const nPinned=()=>Object.keys(PINS).length;
function pinPersist(){try{localStorage.setItem(PKEY,JSON.stringify(PINS))}catch(e){}syncSoon()}
function stSave(){try{localStorage.setItem(STKEY,JSON.stringify(ST))}catch(e){}syncSoon()}
function applyTheme(){if(ST.theme==='light'||ST.theme==='dark')document.documentElement.dataset.theme=ST.theme;else delete document.documentElement.dataset.theme}
applyTheme();
const DTYPES=[['auto','Auto'],['flow','Flow diagram'],['labelled','Labelled diagram'],['compare','Comparison'],['mindmap','Mind map'],['chart','Chart / graph'],['table','Table']];
const THEMES=[['auto','Auto'],['light','Light'],['dark','Dark']];
const SOON={pyq:['PYQ','pyq'],pass:['Pass mark','pass'],topper:['Topper','topper'],faculty:['Faculty','fac'],dev:['Developer','dev']};
const TITLES={home:'Home',fav:'Favourite',pins:'Pinned',settings:'Settings'};
const isSaved=id=>!!SAVED[id];
const nSaved=()=>Object.keys(SAVED).length;
const dateFmt=t=>new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});

const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
const plain=t=>String(t||'').replace(/\*\*/g,'');
function shown(id){const u=ui(id);if(u.tr){const t=TR[id+'|'+u.tr];if(t&&t.text)return t.text}return(ANS[id]||{}).text||''}
function ytLink(q){const c=(IDX[q.id]||{}).course;const s=`${c?cLabel(c):'Class 10 Science'} ${chOf(q.id).title} ${q.video||q.text}`.slice(0,110);return 'https://www.youtube.com/results?search_query='+encodeURIComponent(s)}

function toolbar(q){
 const id=q.id,u=ui(id),a=ANS[id]||{},tr=u.tr?TR[id+'|'+u.tr]:null,v=VIS[id]||{},sv=isSaved(id),mr=u.mk?MR[id+'|'+u.mk]:null;
 return `<div class="tb" role="toolbar" aria-label="Answer tools">
  <button class="ic ${sv?'liked':''}" data-act="like" data-id="${id}" title="${sv?'Saved hai (hatane ke liye dabao)':'Is answer ko save karo'}" aria-label="${sv?'Saved answer, hatane ke liye dabao':'Answer save karo'}" aria-pressed="${sv}">${I.heart}</button>
  <button class="ic" data-act="cp" data-id="${id}" title="Copy" aria-label="Answer copy karo">${u.copied?I.ok:I.cp}</button>
  <button class="ic ${tr&&tr.loading?'spin':''}" data-act="tr" data-id="${id}" title="Translate" aria-label="Translate" aria-pressed="${!!(u.menu||u.tr)}">${I.tr}</button>
  <button class="ic ${v.loading?'spin':''}" data-act="vis" data-id="${id}" title="Diagram" aria-label="Diagram dikhao" aria-pressed="${!!u.vis}">${I.vis}</button>
  <a class="ic" href="${esc(ytLink(q))}" target="_blank" rel="noopener noreferrer" title="Video lecture (YouTube par khulega)" aria-label="Video lecture, YouTube par khulega">${I.vid}</a>
  <button class="ic" data-act="say" data-id="${id}" title="${u.say?'Rok do':'Sunao'}" aria-label="${u.say?'Rok do':'Answer sunao'}" aria-pressed="${!!u.say}">${u.say?I.stop:I.say}</button>
  <button class="ic ${a.loading?'spin':''}" data-act="re" data-id="${id}" ${sv?'disabled':''} title="${sv?'Naya answer banane ke liye pehle heart hata do':'Dobara banao (naya answer)'}" aria-label="${sv?'Dobara banao, saved answer ki wajah se band':'Dobara banao'}">${I.re}</button>
  <button class="ic" data-act="more" data-id="${id}" title="Aur options" aria-label="Aur options" aria-pressed="${!!u.more}">${I.more}</button>
 </div>
 ${u.menu?`<div class="chips" role="group" aria-label="Translate language">
   <button class="chip" data-act="trset" data-id="${id}" data-to="" aria-pressed="${!u.tr}">English</button>
   ${Object.keys(TRL).map(k=>`<button class="chip" data-act="trset" data-id="${id}" data-to="${k}" aria-pressed="${u.tr===k}">${TRL[k].n}</button>`).join('')}</div>`:''}
 ${tr&&tr.loading?`<div class="mut" style="margin-top:8px">Anuvaad ho raha hai…</div>`:''}

window.onCloudData=cd=>{
 let uid=USER&&USER.uid,first=true;
 try{first=localStorage.getItem('orbit_sync_uid')!==uid}catch(e){}
 if(first){
  for(const id in cd.saved)if(!SAVED[id]||(cd.saved[id].at||0)>(SAVED[id].at||0))SAVED[id]=cd.saved[id];
  Object.assign(PINS,cd.pins);

 }else{

  Object.assign(PINS,cd.pins);
  if(cd.settings)ST={...ST,...cd.settings};
 }
 for(const id in SAVED){
  const e=SAVED[id];if(!e||!e.text)continue;
  ANS[id]={text:e.text};if(!CACHE[id])CACHE[id]={text:e.text,at:e.at};
  if(e.svg)VIS[id]={svg:e.svg};
 }
 try{localStorage.setItem(SKEY,JSON.stringify(SAVED));localStorage.setItem(PKEY,JSON.stringify(PINS));localStorage.setItem(STKEY,JSON.stringify(ST));localStorage.setItem(CKEY,JSON.stringify(CACHE));localStorage.setItem('orbit_sync_uid',uid)}catch(e){}
 applyTheme();
 if(first)syncSoon();

};

 else if(act==='re')ask(id,true);
 else if(act==='like')like(id);
 else if(act==='tr'){const u=ui(id);u.menu=!u.menu;draw()}
 else if(act==='trset')setTr(id,b.dataset.to);
 else if(act==='vis')toggleVis(id);
 else if(act==='visre')genVis(id,true);
 else if(act==='say')say(id);
 else if(act==='cp')copy(id);
 else if(act==='vid')openVideo(id);
 else if(act==='login'){LOGINERR='';window.CLOUD.login().catch(e=>{const c=e&&e.code;LOGINERR=c==='auth/popup-closed-by-user'?'':c==='auth/operation-not-allowed'?'Firebase Console me Authentication → Google enable karna baaki hai.':c==='auth/unauthorized-domain'?'Ye website Firebase ke Authorized domains me nahi hai.':'Login nahi ho paya. Dobara try karo.';draw()})}
 else if(act==='logout'){window.CLOUD.logout()}
});

$('#scrim').addEventListener('click',()=>openSide(false));
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&$('#side').classList.contains('open')){openSide(false);return}
 if(e.key!=='Enter'&&e.key!==' ')return;
 const b=e.target.closest&&e.target.closest('.qb[role=button]');if(!b)return;
 e.preventDefault();toggleOpen(b.closest('.q').dataset.qid,true);
});

// Questions are cached too: the page opens at once (even offline or while Render wakes up), then refreshes quietly.
const QKEY='orbit_questions_v1';
let qOld=null;
try{qOld=localStorage.getItem(QKEY);const c=norm(JSON.parse(qOld||'null'));if(c){setData(c);draw()}}catch(e){qOld=null}
fetch('/questions.json').then(r=>r.ok?r:fetch((window.ORBIT_API||'')+'/api/questions')).then(r=>{if(!r.ok)throw new Error('q');return r.json()}).then(d=>{
 const nw=JSON.stringify(d);
 try{localStorage.setItem(QKEY,nw)}catch(e){}
 if(!DATA||nw!==qOld){const nd=norm(d);if(nd){setData(nd);draw()}}
}).catch(()=>{if(!DATA)$('#app').innerHTML='<p class="err">Questions load nahi hue. Internet check karke page refresh karo.</p>'});

if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{})});
</script>
<script type="module">import('/cloud.js').catch(e=>window.onCloudFail&&window.onCloudFail(e))</script>
