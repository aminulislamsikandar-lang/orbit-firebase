name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'   # every Monday: new advisories show up without a code change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # jsdom is only needed by the DOM tests. It is not an app dependency, so Render builds stay small.
      - run: npm install --no-save --no-audit --no-fund --ignore-scripts jsdom@31
      - run: npm test
        env:
          CI: 'true'   # a skipped test counts as a failure

  audit:
    name: Dependency audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high
